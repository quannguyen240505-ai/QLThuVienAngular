<div class="modal-backdrop-custom" *ngIf="isOpen">
  <div class="admin-modal">
    <div class="modal-header-custom">
      <div>
        <h2>Đặt lại mật khẩu</h2>
        <p>
          Tài khoản:
          <strong>{{ selectedUser?.username }}</strong>
        </p>
      </div>

      <button class="modal-close" type="button" (click)="close()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Mật khẩu mới</label>

        <input
          class="form-control"
          type="password"
          formControlName="newPassword"
          placeholder="Nhập mật khẩu mới"
        />

        <div
          class="validation-message"
          *ngIf="
            passwordForm.get('newPassword')?.touched &&
            passwordForm.get('newPassword')?.hasError('required')
          "
        >
          Vui lòng nhập mật khẩu mới.
        </div>

        <div
          class="validation-message"
          *ngIf="
            passwordForm.get('newPassword')?.touched &&
            passwordForm.get('newPassword')?.hasError('minlength')
          "
        >
          Mật khẩu phải có ít nhất 6 ký tự.
        </div>
      </div>

      <div class="modal-actions">
        <button class="admin-secondary-btn" type="button" (click)="close()">Hủy</button>

        <button class="admin-primary-btn" type="submit">
          <i class="bi bi-key"></i>
          Đặt lại mật khẩu
        </button>
      </div>
    </form>
  </div>
</div>

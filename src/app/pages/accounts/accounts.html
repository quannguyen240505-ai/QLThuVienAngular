<section class="admin-page">
  <div class="admin-header">
    <div>
      <div class="admin-label">
        <i class="bi bi-person-gear"></i>
        Quản trị hệ thống
      </div>

      <h1>Quản lý tài khoản</h1>
      <p>Thêm, sửa, khóa, phân quyền và quản lý tài khoản người dùng.</p>
    </div>

    <button class="admin-primary-btn" type="button" (click)="openCreateModal()">
      <i class="bi bi-plus-circle"></i>
      Thêm tài khoản
    </button>
  </div>

  <div class="admin-alert" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="admin-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="admin-toolbar">
    <div class="admin-search">
      <i class="bi bi-search"></i>
      <input
        type="text"
        [(ngModel)]="searchText"
        (ngModelChange)="onFilterChanged()"
        placeholder="Tìm theo username hoặc Gmail..."
      />
    </div>

    <select class="admin-filter" [(ngModel)]="roleFilter" (ngModelChange)="onFilterChanged()">
      <option value="All">Tất cả vai trò</option>
      <option value="Member">Member</option>
      <option value="Librarian">Librarian</option>
      <option value="Admin">Admin</option>
    </select>
  </div>

  <div class="admin-loading" *ngIf="isLoading">
    <i class="bi bi-arrow-repeat"></i>
    Đang tải danh sách tài khoản...
  </div>

  <app-user-table
    *ngIf="!isLoading"
    [users]="pagedUsers"
    (editUser)="openEditModal($event)"
    (deleteUser)="deleteUser($event)"
    (resetPassword)="openResetPasswordModal($event)"
    (toggleStatus)="toggleStatus($event)"
    (changeRole)="changeRole($event)"
  >
  </app-user-table>
  <div class="pagination-wrapper" *ngIf="totalPages > 1">
    <button class="page-btn" [disabled]="currentPage === 1" (click)="previousPage()">
      <i class="bi bi-chevron-left"></i>
    </button>

    <button
      *ngFor="let page of [].constructor(totalPages); let i = index"
      class="page-btn"
      [class.active]="currentPage === i + 1"
      (click)="goToPage(i + 1)"
    >
      {{ i + 1 }}
    </button>

    <button class="page-btn" [disabled]="currentPage === totalPages" (click)="nextPage()">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <app-user-form-modal
    [isOpen]="isUserModalOpen"
    [editingUser]="editingUser"
    [apiErrorMessage]="userModalErrorMessage"
    [isSaving]="isSavingUser"
    (closeModal)="closeUserModal()"
    (saveCreate)="createUser($event)"
    (saveUpdate)="updateUser($event)"
  >
  </app-user-form-modal>

  <app-reset-password-modal
    [isOpen]="isResetPasswordModalOpen"
    [selectedUser]="selectedUser"
    (closeModal)="closeResetPasswordModal()"
    (savePassword)="resetPassword($event)"
  >
  </app-reset-password-modal>
</section>

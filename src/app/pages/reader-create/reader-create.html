<form (ngSubmit)="save()">

  <div class="form-grid">

    <div class="form-group">
      <label>Họ tên</label>
      <input
        type="text"
        name="fullName"
        [(ngModel)]="reader.fullName"
        placeholder="Nhập họ tên" />
    </div>

    <div class="form-group">
      <label>Giới tính</label>
      <select
        name="gender"
        [(ngModel)]="reader.gender">

        <option value="">-- Chọn giới tính --</option>
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
        <option value="Khác">Khác</option>

      </select>
    </div>

    <div class="form-group">
      <label>Ngày sinh</label>
      <input
        type="date"
        name="dateOfBirth"
        [(ngModel)]="reader.dateOfBirth" />
    </div>

    <div class="form-group">
      <label>Số điện thoại</label>
      <input
        type="text"
        name="phone"
        [(ngModel)]="reader.phone"
        placeholder="Nhập số điện thoại" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="reader.email"
        placeholder="Nhập email" />
    </div>

    <div class="form-group">
      <label>Trạng thái</label>
      <select
        name="status"
        [(ngModel)]="reader.status">

        <option value="Active">Hoạt động</option>
        <option value="Inactive">Ngừng hoạt động</option>

      </select>
    </div>

    <div class="form-group full">
      <label>Địa chỉ</label>
      <textarea
        rows="4"
        name="address"
        [(ngModel)]="reader.address"
        placeholder="Nhập địa chỉ"></textarea>
    </div>

  </div>

  <div class="form-actions">
    <button type="submit" class="save-btn">
      {{ isEdit ? 'Cập nhật độc giả' : 'Thêm độc giả' }}
    </button>

    <a routerLink="/readers" class="cancel-btn">
      Hủy
    </a>
  </div>

</form>

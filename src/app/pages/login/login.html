<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-person-circle"></i>
      </div>

      <h1>Đăng nhập</h1>
      <p>Truy cập hệ thống thư viện đại học</p>
    </div>

    <div class="auth-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="social-login">
      <button class="social-btn google-btn" type="button" (click)="loginWithGoogle()">
        <i class="bi bi-google"></i>
        <span>Đăng nhập với Google</span>
      </button>

      <button class="social-btn facebook-btn" type="button">
        <i class="bi bi-facebook"></i>
        <span>Đăng nhập với Facebook</span>
      </button>
    </div>

    <div class="auth-divider">
      <span>hoặc đăng nhập bằng tài khoản</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">

      <div class="form-group">
        <label>Username</label>
        <input
          class="form-control"
          type="text"
          formControlName="username"
          placeholder="Nhập tên đăng nhập" />

        <div class="validation-message"
             *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')">
          Vui lòng nhập tên đăng nhập.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          class="form-control"
          type="password"
          formControlName="password"
          placeholder="Nhập mật khẩu" />

        <div class="validation-message"
             *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Vui lòng nhập mật khẩu.
        </div>
      </div>

      <button class="auth-submit" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>

      <div class="remember-row">
        <span></span>
        <a routerLink="/forgot-password">Quên mật khẩu?</a>
      </div>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </div>

  </div>
</div>

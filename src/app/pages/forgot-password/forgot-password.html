<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-envelope-lock"></i>
      </div>

      <h1>Quên mật khẩu</h1>
      <p>Nhập Gmail đã đăng ký để nhận mã PIN đặt lại mật khẩu.</p>
    </div>

    <div class="auth-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="auth-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="handleForgotPassword()">

      <div class="form-group">
        <label>Gmail</label>

        <input
          class="form-control"
          type="email"
          formControlName="gmail"
          placeholder="Nhập Gmail của bạn" />

        <div
          class="validation-message"
          *ngIf="forgotForm.get('gmail')?.touched && forgotForm.get('gmail')?.hasError('required')">
          Vui lòng nhập Gmail.
        </div>

        <div
          class="validation-message"
          *ngIf="forgotForm.get('gmail')?.touched && forgotForm.get('gmail')?.hasError('email')">
          Gmail không hợp lệ.
        </div>
      </div>

      <button class="auth-submit" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Đang gửi mã PIN...' : 'Gửi mã PIN' }}
      </button>
    </form>

    <div class="auth-footer">
      Đã nhớ mật khẩu?
      <a routerLink="/login">Đăng nhập</a>
    </div>

  </div>
</div>
